services:
  ingress:
    image: alpine/socat:latest
    container_name: mt_api_wrapper_ingress
    restart: always
    ports:
      - "127.0.0.1:23982:8000"
    networks:
      - mt_api_wrapper_network
      - mt_api_wrapper_publish
    command: tcp-listen:8000,fork,reuseaddr tcp-connect:web:8000
    depends_on:
      web:
        condition: service_healthy

  web:
    image: ghcr.io/imanuelbertrand/manictime-api-wrapper:latest
    container_name: mt_api_wrapper_app
    restart: always
    environment:
      - FLASK_ENV=${FLASK_ENV}
      - SECRET_KEY=${SECRET_KEY}
      - SERVER_NAME=${SERVER_NAME}
      - APPLICATION_ROOT=${APPLICATION_ROOT}
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME}
      - MT_SERVER_URL=${MT_SERVER_URL}
      - MT_USERNAME=${MT_USERNAME}
      - MT_PASSWORD=${MT_PASSWORD}
      - API_KEY=${API_KEY}
      - CACHE_DEFAULT_TIMEOUT=${CACHE_DEFAULT_TIMEOUT:-300}
      - HTTPS_PROXY=http://squid:3128
      - HTTP_PROXY=http://squid:3128
      - NO_PROXY=localhost,127.0.0.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    depends_on:
      squid:
        condition: service_healthy
    networks:
      - mt_api_wrapper_network

  squid:
    image: ghcr.io/imanuelbertrand/manictime-api-wrapper-squid:latest
    container_name: mt_api_wrapper_squid
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MT_HOSTNAME=${MT_HOSTNAME}
      - MT_PORT=${MT_PORT:-80}
    networks:
      - mt_api_wrapper_network
      - mt_api_wrapper_external
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3128'" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

networks:
  mt_api_wrapper_network:
    driver: bridge
    internal: true
  mt_api_wrapper_publish:
    driver: bridge
  mt_api_wrapper_external:
    driver: bridge
