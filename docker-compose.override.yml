services:
  squid:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: squid
      args:
        MT_HOSTNAME: ${MT_HOSTNAME:-}
    environment:
      - MT_HOSTNAME=${MT_HOSTNAME}
    volumes:
      - ./docker/squid/squid-dev.conf.template:/etc/squid/squid.conf.template:ro

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: development
    volumes:
      - .:/app
      - ./docker/.claude.json:/home/appuser/.claude.json
      - ./docker/.claude/:/home/appuser/.claude/
      - claude_local:/home/appuser/.local
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost:8000}
      - PREFERRED_URL_SCHEME=${PREFERRED_URL_SCHEME:-http}

volumes:
  claude_local:
